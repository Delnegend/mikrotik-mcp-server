name: Release

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Next version (Conventional Commits)
    runs-on: ubuntu-slim
    outputs:
      bump: ${{ steps.semver.outputs.bump }}
      next: ${{ steps.semver.outputs.next }}
      nextStrict: ${{ steps.semver.outputs.nextStrict }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine next version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux/amd64
          - goos: darwin
            goarch: arm64
            platform: darwin/arm64
          - goos: windows
            goarch: amd64
            platform: windows/amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.nextStrict }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-X main.version=$VERSION" -o "mikrotik-mcp${ext}" .
          go build -ldflags="-X main.version=$VERSION" -o "rosbackup${ext}" ./cmd/rosbackup

      - name: Package archive
        run: |
          base="mikrotik-mcp-${{ matrix.goos }}-${{ matrix.goarch }}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          mkdir -p "$base"
          mv "mikrotik-mcp${ext}" "rosbackup${ext}" "$base"/
          if [ "${{ matrix.goos }}" = "windows" ]; then
            if ! command -v 7z >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
            fi
            7z a -t7z "${base}.7z" "$base" >/dev/null
          else
            tar -cJf "${base}.tar.xz" "$base"
          fi
          rm -rf "$base"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mikrotik-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mikrotik-mcp-${{ matrix.goos }}-${{ matrix.goarch }}.*

  release:
    name: Publish Consolidated Release
    needs: [version, build]
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-slim
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Consolidated Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.next }}
          generate_release_notes: true
          files: |
            artifacts/*
