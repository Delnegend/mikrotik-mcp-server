name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (e.g. 0.1.0)
        required: true
        type: string
        default: 0.1.0
      create_release:
        description: Push to GitHub Releases
        required: true
        type: boolean
        default: false

env:
  BINARY_NAME: mikrotik-mcp
  VERSION: ${{ inputs.release_version }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-X main.version=$VERSION" -o "mikrotik-mcp${ext}" .
          go build -ldflags="-X main.version=$VERSION" -o "rosbackup${ext}" ./cmd/rosbackup

      - name: Compress binaries
        run: |
          base="${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          mkdir -p "$base"
          mv "mikrotik-mcp${ext}" "rosbackup${ext}" "$base"/
          if [ "${{ matrix.goos }}" = "windows" ]; then
            if ! command -v 7z >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
            fi
            7z a -t7z "${base}.7z" "$base" >/dev/null
          else
            tar -cJf "${base}.tar.xz" "$base"
          fi
          rm -rf "$base"
          ls -lh "${base}."*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: Release
    needs: build
    if: inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.release_version }}
          name: v${{ inputs.release_version }}
          body: |
            ## v${{ inputs.release_version }}

            Each archive contains two binaries:

            - **`mikrotik-mcp`** — the MCP server (Windows: `.exe`)
            - **`rosbackup`** — the backup/restore CLI (Windows: `.exe`)

            Platforms: Linux (amd64, arm64), macOS (arm64), Windows (amd64).

            Download the archive for your platform below:

            - **Windows**: `.7z` (extract with 7-Zip)
            - **Linux / macOS**: `.tar.xz` (extract with `tar -xJf`)
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
