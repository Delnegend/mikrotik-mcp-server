name: Release / Build Artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Release mode / build target"
        required: true
        type: choice
        default: "new-tag"
        options:
          - new-tag  # Gate on CI -> bump version -> tag & push -> build & publish release
          - tag      # Rebuild existing tag -> build & publish release
          - commit   # Test build latest commit -> upload Actions artifacts only (no release)
      ref:
        description: "Custom tag or commit SHA (optional, defaults to latest)"
        required: false
        type: string
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC (defaults to target: new-tag)

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare / Bump Version
    runs-on: ubuntu-latest   # full runner: it runs `just check`
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
          persist_credentials: true
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@v4

      # -----------------------------------------------------------------------
      # Mode 1: new-tag (calculate semver -> CI gate -> just bump -> atomic push)
      # -----------------------------------------------------------------------
      - name: Calculate Next SemVer
        if: (inputs.target || 'new-tag') == 'new-tag'
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: CI Gate (verify code is green before bumping)
        if: (inputs.target || 'new-tag') == 'new-tag' && steps.semver.outputs.bump != 'none'
        run: just check

      - name: Bump package manager version
        if: (inputs.target || 'new-tag') == 'new-tag' && steps.semver.outputs.bump != 'none'
        env:
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: just bump "$NEXT_STRICT"

      - name: Commit, Tag, and Push atomically
        if: (inputs.target || 'new-tag') == 'new-tag' && steps.semver.outputs.bump != 'none'
        env:
          NEXT_TAG: ${{ steps.semver.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"

          git add -u
          if git diff --staged --quiet; then
            echo "no manifest to bump — tagging HEAD"
          else
            git commit -m "chore(release): ${NEXT_TAG}"
          fi

          git rev-parse -q --verify "refs/tags/${NEXT_TAG}" >/dev/null && { echo "::error::tag ${NEXT_TAG} already exists"; exit 1; }
          git tag -a "${NEXT_TAG}" -m "Release ${NEXT_TAG}"

          git push origin HEAD:main "refs/tags/${NEXT_TAG}"

      # -----------------------------------------------------------------------
      # Resolve outputs for Job 2 (build)
      # -----------------------------------------------------------------------
      - name: Resolve outputs
        id: resolve
        env:
          TARGET: ${{ inputs.target || 'new-tag' }}
          INPUT_REF: ${{ inputs.ref }}
          BUMP: ${{ steps.semver.outputs.bump }}
          CURRENT: ${{ steps.semver.outputs.current }}
          NEXT: ${{ steps.semver.outputs.next }}
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "new-tag" ]; then
            if [ "$BUMP" = "none" ]; then
              echo "No version bump needed (current: ${CURRENT:-none})."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "ref=$NEXT"
              echo "version=$NEXT_STRICT"
              echo "publish=true"
              echo "skip=false"
            } >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = "tag" ]; then
            TAG="${INPUT_REF:-$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)}"
            [ -n "$TAG" ] || { echo "::error::No release tag found"; exit 1; }
            { echo "ref=$TAG"; echo "version=${TAG#v}"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
          else
            SHA="${INPUT_REF:-$(git rev-parse HEAD)}"
            { echo "ref=$SHA"; echo "version=$SHA"; echo "publish=false"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            echo "Running test build against commit $SHA (will not publish release)"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux/amd64
          - goos: darwin
            goarch: arm64
            platform: darwin/arm64
          - goos: windows
            goarch: amd64
            platform: windows/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-X main.version=$VERSION" -o "mikrotik-mcp${ext}" .
          go build -ldflags="-X main.version=$VERSION" -o "rosbackup${ext}" ./cmd/rosbackup

      - name: Package archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          base="mikrotik-mcp-${GOOS}-${GOARCH}"
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p "$base"
          mv "mikrotik-mcp${ext}" "rosbackup${ext}" "$base"/
          if [ "$GOOS" = "windows" ]; then
            if ! command -v 7z >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
            fi
            7z a -t7z "${base}.7z" "$base" >/dev/null
          else
            tar -cJf "${base}.tar.xz" "$base"
          fi
          rm -rf "$base"

      - name: Upload platform archive
        uses: actions/upload-artifact@v7
        with:
          name: mikrotik-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mikrotik-mcp-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error

  release:
    name: Publish Consolidated Release
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Consolidated Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.ref }}
          generate_release_notes: true
          files: |
            artifacts/*
