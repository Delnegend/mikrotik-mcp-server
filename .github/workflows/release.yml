name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (e.g. 0.1.0)
        required: true
        type: string
        default: 0.1.0
      create_release:
        description: Push to GitHub Releases
        required: true
        type: boolean
        default: false

env:
  BINARY_NAME: mikrotik-mcp
  VERSION: ${{ inputs.release_version }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-X main.version=$VERSION" -o "mikrotik-mcp${ext}" .
          go build -ldflags="-X main.version=$VERSION" -o "rosbackup${ext}" ./cmd/rosbackup

      - name: Compress binaries
        run: |
          base="${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          mkdir -p "$base"
          mv "mikrotik-mcp${ext}" "rosbackup${ext}" "$base"/
          if [ "${{ matrix.goos }}" = "windows" ]; then
            if ! command -v 7z >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
            fi
            7z a -t7z "${base}.7z" "$base" >/dev/null
          else
            tar -cJf "${base}.tar.xz" "$base"
          fi
          rm -rf "$base"
          ls -lh "${base}."*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: Release
    needs: build
    if: inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes from commits since the last tag
        id: notes
        run: |
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
            COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...v${VERSION}"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
            COMPARE=""
          fi
          echo "Generating notes for range $RANGE"
          TMP="$(mktemp -d)"
          git log --pretty=format:"%s" "$RANGE" > "$TMP/all"
          {
            echo "## What's Changed"
            echo
            for spec in "feat **Features**" "fix **Bug Fixes**" "docs **Documentation**" "ci **CI & Workflows**" "test **Tests**" "refactor **Refactoring**" "perf **Performance**" "chore **Chores**"; do
              type="${spec%% *}"
              grep -E "^${type}(\\([^)]*\\))?: " "$TMP/all" > "$TMP/items" || continue
              echo "${spec#* }"
              sed -E "s/^${type}(\\([^)]*\\))?: +/  - /" "$TMP/items"
              echo
            done
            grep -Ev "^[a-z]+(\\([^)]*\\))?: " "$TMP/all" > "$TMP/other" || true
            if [ -s "$TMP/other" ]; then
              echo "**Other**"
              sed 's/^/  - /' "$TMP/other"
              echo
            fi
            echo "**Downloads**"
            echo "- **Windows**: \`.7z\` (extract with 7-Zip)"
            echo "- **Linux / macOS**: \`.tar.xz\` (extract with \`tar -xJf\`)"
            echo "- Each archive contains \`mikrotik-mcp\` and \`rosbackup\`"
            if [ -n "$COMPARE" ]; then
              echo
              echo "**Full Changelog**: $COMPARE"
            fi
          } > notes.md
          echo "=== draft release notes ==="
          cat notes.md
          echo "notes=$PWD/notes.md" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.release_version }}
          name: v${{ inputs.release_version }}
          body_path: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
