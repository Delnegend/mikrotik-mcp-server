name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# Full matrix on PR — weekly cadence, so cost is acceptable
# Pure Go adaptation: no Wails/Bun, cross-compile with CGO_ENABLED=0

permissions:
  contents: read

jobs:
  check:
    name: Check (just check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v3
      - name: Run checks
        run: just check

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux/amd64
          - goos: linux
            goarch: arm64
            platform: linux/arm64
          - goos: darwin
            goarch: arm64
            platform: darwin/arm64
          - goos: windows
            goarch: amd64
            platform: windows/amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-X main.version=dev" -o "mikrotik-mcp${ext}" .
          go build -ldflags="-X main.version=dev" -o "rosbackup${ext}" ./cmd/rosbackup
          ls -lh "mikrotik-mcp${ext}" "rosbackup${ext}"

  chr:
    name: CHR (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHR_VERSION: 7.23.3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache CHR image
        uses: actions/cache@v6
        with:
          path: scripts/chr/chr-${{ env.CHR_VERSION }}.img
          key: chr-${{ env.CHR_VERSION }}

      - name: Install CHR toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils unzip netcat-openbsd
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          else
            echo "KVM unavailable; falling back to TCG software emulation"
          fi

      - name: Boot CHR and run the full suite
        run: bash scripts/chr/test.sh --down
