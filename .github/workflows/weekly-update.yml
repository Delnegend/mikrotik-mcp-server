name: Weekly Update and Release

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Update dependencies
        run: |
          go get -u ./...
          go mod tidy

      - name: Check for changes
        id: changes
        run: |
          if ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run checks
        id: check
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: |
          go build ./...
          go vet ./...
          go test ./...
          test -z "$(gofmt -l .)"

      - name: Compute next version
        id: version
        if: steps.changes.outputs.changed == 'true' && steps.check.outcome == 'success'
        run: |
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          latest=${latest#v}
          IFS='.' read -r major minor patch <<< "$latest"
          echo "new_version=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

      - name: Auto-commit and push
        if: steps.changes.outputs.changed == 'true' && steps.check.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(deps): weekly dependency update"
          git push

      - name: Trigger release
        if: steps.changes.outputs.changed == 'true' && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml -f release_version=${{ steps.version.outputs.new_version }} -f create_release=true

      - name: Open PR on failure
        if: steps.changes.outputs.changed == 'true' && steps.check.outcome == 'failure'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): weekly dependency update'
          title: 'chore(deps): weekly dependency update'
          branch: chore/update-deps
          delete-branch: true
          labels: dependencies
