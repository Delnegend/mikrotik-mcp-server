name: Weekly Update

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Update dependencies
        run: |
          go get -u=patch ./...
          go mod tidy

      - name: Check for changes
        id: changes
        run: |
          if ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install CHR toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils unzip netcat-openbsd
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          else
            echo "KVM unavailable; falling back to TCG software emulation"
          fi

      - name: Full suite against a live CHR
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          bash scripts/chr/test.sh --down

      - name: Open PR for review
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): weekly dependency update'
          title: 'chore(deps): weekly dependency update'
          branch: chore/update-deps
          delete-branch: true
          labels: dependencies
