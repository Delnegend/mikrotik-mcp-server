name: Weekly Update

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CHR_VERSION: 7.23.3

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Update dependencies
        run: |
          go get -u=patch ./...
          go mod tidy

      - name: Check for changes
        id: changes
        run: |
          if ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache CHR image
        uses: actions/cache@v6
        with:
          path: scripts/chr/chr-${{ env.CHR_VERSION }}.img
          key: chr-${{ env.CHR_VERSION }}

      - name: Install CHR toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils unzip netcat-openbsd
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          else
            echo "KVM unavailable; falling back to TCG software emulation"
          fi

      - name: Full suite against a live CHR
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          bash scripts/chr/test.sh --down

      - name: Draft PR body from the dependency diff
        id: prbody
        if: steps.changes.outputs.changed == 'true'
        run: |
          {
            echo "## Dependency changes"
            echo ""
            git diff -- go.mod | awk '
              /^[+-][[:space:]]+[^ ]+ v[0-9]/ {
                sign = substr($0, 1, 1); mod = $2; ver = $3
                if (sign == "-") old[mod] = ver; else new[mod] = ver
              }
              END {
                for (m in old) printf "- %s: %s -> %s\n", m, old[m], (new[m] ? new[m] : "removed")
                for (m in new) if (!(m in old)) printf "- %s: added %s\n", m, new[m]
              }' | sort
            echo ""
            echo "Generated by the weekly dependency-update workflow. The full test suite "
            echo "(including the RouterOS CHR integration tests) ran against these changes."
          } > /tmp/pr-body.md
          {
            echo "body<<EOF"
            cat /tmp/pr-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open PR for review
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): weekly dependency update'
          title: 'chore(deps): weekly dependency update'
          body: ${{ steps.prbody.outputs.body }}
          branch: chore/update-deps
          delete-branch: true
          labels: dependencies
