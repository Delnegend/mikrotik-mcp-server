name: Test PR Permission
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - run: echo "pr permission probe" >> probe.txt
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'test: pr permission probe'
          title: 'test: pr permission probe'
          branch: chore/pr-permission-probe
          delete-branch: true
