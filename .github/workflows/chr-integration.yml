name: CHR Integration Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chr:
    name: CHR (integration)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      CHR_VERSION: 7.23.3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache CHR image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: scripts/chr/chr-${{ env.CHR_VERSION }}.img
          key: chr-${{ env.CHR_VERSION }}

      - name: Install CHR toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils unzip netcat-openbsd
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          else
            echo "KVM unavailable; falling back to TCG software emulation"
          fi

      - name: Boot CHR and run the full suite
        run: bash scripts/chr/test.sh --down
