name: Integration

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  chr:
    name: Full suite against a live CHR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install CHR toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils unzip netcat-openbsd
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          else
            echo "KVM unavailable; falling back to TCG software emulation"
          fi

      - name: Boot CHR and run the full suite
        run: bash scripts/chr/test.sh --down
